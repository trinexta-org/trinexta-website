name: Deploy Staging

on:
  push:
    branches:
      - staging
      - dev

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /var/www/trinexta-website
            git fetch origin
            git checkout ${{ github.ref_name }}
            git pull origin ${{ github.ref_name }}
            npm ci
            npx prisma migrate deploy
            npx prisma generate
            npm run build
            # minimumCacheTTL=31j : sans purge, les images remplacees sous le
            # meme chemin resteraient servies depuis l'ancien cache jusqu'a 31j.
            # Le cache est ecrit par le process PM2 : si celui-ci tourne sous un
            # autre user, le rm echoue. On ne doit jamais bloquer le deploiement
            # pour autant (set -e couperait avant le reload PM2).
            rm -rf .next/cache/images \
              || echo "ATTENTION: purge du cache images incomplete (droits), images potentiellement perimees"
            pm2 startOrReload ecosystem.config.js --only trinexta-staging --update-env
            pm2 save
            # Encode les images LCP maintenant plutot que de faire attendre
            # le premier visiteur (~2 s d'encodage AVIF par variante).
            node scripts/prewarm-images.mjs http://127.0.0.1:3010 || true

  sync:
    name: Sync dev -> staging branch
    needs: deploy
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fast-forward staging to dev
        run: |
          git merge origin/dev --ff-only
          git push origin staging
