name: AI Code Review

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - dev

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    name: Claude Review
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare diff
        id: diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD \
            -- ':(exclude)package-lock.json' \
               ':(exclude)src/generated/prisma' \
            > /tmp/full_diff.txt

          TOTAL=$(wc -l < /tmp/full_diff.txt)
          head -n 1500 /tmp/full_diff.txt > /tmp/diff.txt
          git show origin/${{ github.base_ref }}:AGENTS.md > /tmp/agents.md

          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          [ "$TOTAL" -gt 1500 ] && echo "truncated=true" >> $GITHUB_OUTPUT || echo "truncated=false" >> $GITHUB_OUTPUT

      - name: PR trop grande - notifier
        if: steps.diff.outputs.truncated == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const total = '${{ steps.diff.outputs.total }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `> [!WARNING]\n> PR trop grande pour la revue automatique (${total} lignes hors lockfile) - revue manuelle requise @hyosua.`
            });

      - name: Call Claude
        if: steps.diff.outputs.truncated == 'false'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 .github/scripts/ai-review.py

      - name: Post comment
        if: steps.diff.outputs.truncated == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let review;
            try {
              review = fs.readFileSync('/tmp/review.txt', 'utf8');
            } catch {
              review = '*Revue automatique indisponible.*';
            }
            const marker = '<!-- ai-review -->';
            const body = `${marker}\n${review}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100
            });
            const existing = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' &&
              (comment.body?.includes(marker) || comment.body?.includes('## Revue automatique'))
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body
              });
            }
